<svg xmlns="http://www.w3.org/2000/svg" width="944" height="358" viewBox="0 0 944 358" role="img" aria-labelledby="t d">
<title id="t">cross-port-kill: pk --tree</title>
<desc id="d">A terminal stops more than the port holder. pk 3000 --children frees port 3000 and also stops the 4 worker processes under it. pk 5050 --tree lists the parent it would stop, pgadmin4, warns that unsaved work is lost and asks &quot;Stop them? [y/N]&quot;. After answering y, port 5050 is freed and the parent pgadmin4 is stopped too.</desc>
