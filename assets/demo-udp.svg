<svg xmlns="http://www.w3.org/2000/svg" width="800" height="314" viewBox="0 0 800 314" role="img" aria-labelledby="t d">
<title id="t">cross-port-kill: pk udp ports</title>
<desc id="d">A terminal frees a UDP port. pk 5353 says port 5353 is already free, because ports are TCP by default. pk udp ports lists the UDP ports in use: node bound to 5353 on all interfaces, and suggests 'To free one: pk 5353/udp' or picking from a list with pk --udp. pk 5353/udp frees it: 'Freed port 5353/udp — killed node via SIGTERM (graceful)'.</desc>
