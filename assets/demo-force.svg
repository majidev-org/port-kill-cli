<svg xmlns="http://www.w3.org/2000/svg" width="800" height="182" viewBox="0 0 800 182" role="img" aria-labelledby="t d">
<title id="t">cross-port-kill: pk 9000</title>
<desc id="d">A terminal frees ports held by processes that ignore SIGTERM. pk 9000 sends SIGTERM, waits, and escalates: &quot;Freed port 9000 — killed node via SIGTERM, then SIGKILL&quot;. pk 9001 --force kills immediately: &quot;via SIGKILL (forced)&quot;.</desc>
