<title id="t">cross-port-kill: pk 8080</title>
<desc id="d">A terminal frees a port published by Docker. pk 8080 --info shows the container api running nginx:1.27 on port 8080, listed as a container rather than as the Docker proxy process. pk 8080 then frees the port by stopping the container via docker stop.</desc>
