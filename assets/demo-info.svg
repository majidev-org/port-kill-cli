<svg xmlns="http://www.w3.org/2000/svg" width="908" height="446" viewBox="0 0 908 446" role="img" aria-labelledby="t d">
<title id="t">cross-port-kill: pk --info</title>
<desc id="d">A terminal inspects ports without killing anything. pk 3000 --info shows node on port 3000, localhost only, with its PID, user and command, then &quot;1 in use&quot;. pk --info lists every port in use: two node servers, a python3 server reachable on all interfaces, and a Docker container running nginx.</desc>
